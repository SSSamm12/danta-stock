async function fetchPrice(code) {
  try {
    const res = await fetch(`${PROXY}/quote/${code}?token=${TOKEN}`);
    const data = await res.json();
    const o = data.output;
    if (!o || !o.stck_prpr) return null;
    return {
      price: parseInt(o.stck_prpr),
      change: parseFloat(o.prdy_ctrt),
      volRatio: parseFloat((parseInt(o.acml_vol||0) / Math.max(parseInt(o.avrg_vol||1),1)).toFixed(1))
    };
  } catch(e) { return null; }
}

function switchMode(m) {
  curMode = m;
  ['danta','long','sector','report'].forEach(x => {
    document.getElementById('m-'+x).classList.toggle('active', x===m);
  });
  document.getElementById('filter-bar').style.display = (m==='sector'||m==='report') ? 'none' : 'flex';
  document.getElementById('card-section').style.display = (m==='sector'||m==='report') ? 'none' : 'flex';
  document.getElementById('sector-section').style.display = m==='sector' ? 'block' : 'none';
  document.getElementById('report-section').style.display = m==='report' ? 'block' : 'none';
  if (m==='danta') document.getElementById('sec-title').textContent = '오늘의 단타 추천 종목';
  if (m==='long') document.getElementById('sec-title').textContent = '장기 투자 추천 종목';
  if (m==='sector') document.getElementById('sec-title').textContent = '섹터별 시장 분석';
  if (m==='report') document.getElementById('sec-title').textContent = '오늘의 시황 리포트';
  if (m==='danta') render(allStocks);
  else if (m==='long') render(longStocks);
  else if (m==='sector') renderSectors();
  else if (m==='report') renderReport();
}

function setFilter(f, el) {
  curFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render(curMode==='danta' ? allStocks : longStocks);
}

function render(data) {
  const list = (curFilter==='all' ? data : data.filter(s=>s.sector===curFilter)).sort((a,b)=>b.score-a.score);
  document.getElementById('cnt').textContent = list.length+'개 종목';
  const container = document.getElementById('card-section');
  container.innerHTML = '';
  if (!list.length) { container.innerHTML='<div style="text-align:center;padding:30px;color:#aaa;font-size:14px">해당 섹터 종목 없음</div>'; return; }
  list.forEach((s,i) => {
    const rc = i===0?'r1':i===1?'r2':i===2?'r3':'rn';
    const cc = s.change>0?'up':s.change<0?'down':'flat';
    const sign = s.change>0?'+':'';
    const starN = Math.min(5,Math.round(s.score/20));
    const stars = '★'.repeat(starN)+'☆'.repeat(5-starN);
    const tagsHtml = s.tags.map(t=>`<span class="tag ${t.c}">${t.l}</span>`).join('');
    const isLong = curMode==='long';
    const el = document.createElement('div');
    el.className = 'card'+(isLong?' longterm':'');
    const detailHtml = isLong ? `
      <div class="dgrid">
        <div class="dc"><div class="dlabel">현재가</div><div class="dval ${cc}">${s.price?s.price.toLocaleString():'-'}</div></div>
        <div class="dc"><div class="dlabel">투자기간</div><div class="dval" style="color:#10b981">${s.horizon}</div></div>
        <div class="dc"><div class="dlabel">예상수익</div><div class="dval up">${s.upside}</div></div>
        <div class="dc"><div class="dlabel">추천점수</div><div class="dval" style="color:#f59e0b">${s.score}점</div></div>
      </div>
      <div class="sbox long"><strong>장투 포인트</strong><br><span style="font-size:12px;color:#444">${s.point}</span></div>` : `
      <div class="dgrid">
        <div class="dc"><div class="dlabel">현재가</div><div class="dval ${cc}">${s.price?s.price.toLocaleString():'로딩중'}</div></div>
        <div class="dc"><div class="dlabel">RSI</div><div class="dval ${s.rsi<35?'up':s.rsi>65?'down':''}">${s.rsi}</div></div>
        <div class="dc"><div class="dlabel">MACD</div><div class="dval ${s.macd==='매수'?'up':s.macd==='매도'?'down':'flat'}">${s.macd}</div></div>
        <div class="dc"><div class="dlabel">거래량</div><div class="dval up">${s.volRatio||'-'}배</div></div>
      </div>
      <div class="sbox danta">
        <strong>단타 전략</strong><br>
        진입가 <strong>${s.price?s.price.toLocaleString():'-'}원</strong> &nbsp;|&nbsp;
        목표가 <strong style="color:#ef4444">${s.price?Math.round(s.price*1.025).toLocaleString():'-'}원(+2.5%)</strong> &nbsp;|&nbsp;
        손절가 <strong style="color:#3b82f6">${s.price?Math.round(s.price*0.985).toLocaleString():'-'}원(-1.5%)</strong>
      </div>`;
    el.innerHTML = `
      <div class="card-top">
        <div class="rank ${rc}">${i+1}</div>
        <div>
          <div class="smeta">${s.market==='kospi'?'코스피':'코스닥'} · ${s.code} · ${s.sector}</div>
          <div class="sname">${s.name}</div>
          <div class="tags">${tagsHtml}</div>
        </div>
        <div class="right">
          <div class="price ${cc}">${s.price?s.price.toLocaleString()+'원':'로딩중...'}</div>
          <div class="chg ${cc}">${sign}${s.change||0}%</div>
          <div class="stars">${stars} <span style="font-size:11px;color:#aaa">${s.score}점</span></div>
        </div>
      </div>
      <div class="detail" id="d${i}">
        <div class="rtext">${s.reason}</div>
        ${detailHtml}
      </div>`;
    el.querySelector('.card-top').addEventListener('click', ()=>document.getElementById('d'+i).classList.toggle('open'));
    container.appendChild(el);
  });
}

function renderSectors() {
  document.getElementById('cnt').textContent = SECTORS.length+'개 섹터';
  document.getElementById('sector-section').innerHTML = '<div class="sector-grid">'+SECTORS.map(s=>`
    <div class="sector-card">
      <h3>${s.icon} ${s.name}</h3>
      <p>${s.desc}</p>
      <div style="margin-top:8px;font-size:11px;color:#888">모멘텀 ${s.momentum} | 리스크 ${s.risk}</div>
      <div class="stocks">${s.stocks.map(st=>`<span class="tag tgr">${st}</span>`).join('')}</div>
    </div>`).join('')+'</div>';
}

function renderReport() {
  document.getElementById('cnt').textContent = '오늘 리포트';
  const s = document.getElementById('report-section');
  s.innerHTML = `
    <div class="report-wrap">
      <div class="report-meta">📅 ${REPORT.date} · ${REPORT.updated}</div>
      <div class="report-card">
        <h3>🌍 글로벌 시황</h3>
        <div class="report-grid">${REPORT.global.map(i=>`<div class="report-item"><div class="ri-label">${i.label}</div><div class="ri-val ${i.cls}">${i.value}</div></div>`).join('')}</div>
      </div>
      <div class="report-card">
        <h3>📈 국내 시황 (지난주 요약)</h3>
        <div class="report-grid">${REPORT.domestic.map(i=>`<div class="report-item"><div class="ri-label">${i.label}</div><div class="ri-val ${i.cls}">${i.value}</div></div>`).join('')}</div>
      </div>
      <div class="report-card">
        <h3>💰 외국인·국민연금 수급</h3>
        <div class="report-grid">${REPORT.supply.map(i=>`<div class="report-item"><div class="ri-label">${i.label}</div><div class="ri-val ${i.cls}">${i.value}</div></div>`).join('')}</div>
      </div>
      <div class="report-card">
        <h3>🔥 이번 주 주도 테마</h3>
        ${REPORT.themes.map(t=>`<div class="stock-comment"><div class="sc-name">${t.name} <span class="report-badge ${t.badge}">${t.badge==='rb-up'?'강세':t.badge==='rb-down'?'약세':'주목'}</span></div><div class="sc-text">${t.comment}</div></div>`).join('')}
      </div>
      <div class="report-card">
        <h3>🎯 종목별 코멘트</h3>
        ${REPORT.stocks.map(s=>`<div class="stock-comment"><div class="sc-name">${s.name}</div><div class="sc-text">${s.comment}</div></div>`).join('')}
      </div>
      <div class="report-card" style="border-left:3px solid #f97316">
        <h3>⚠️ 리스크 요인</h3>
        <ul>${REPORT.risk.map(r=>`<li>${r}</li>`).join('')}</ul>
      </div>
      <div class="report-card" style="border-left:3px solid #10b981">
        <h3>💡 이번 주 전망</h3>
        <p>${REPORT.tomorrow}</p>
      </div>
      <div class="report-card" style="background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);border:none">
        <h3 style="color:#fff">🤖 AI 종합 의견</h3>
        <p style="color:#e2e8f0;line-height:1.9;font-size:13px;white-space:pre-line">${REPORT.aiOpinion}</p>
      </div>
    </div>`;
}

async function init() {
  const note = document.getElementById('top-note');
  note.innerHTML = '<span class="spinner"></span>한투 API 실시간 시세 불러오는 중...';
  note.className = 'note loading';

  try {
    TOKEN = await getToken();
    const dantaResults = [];
    for (const s of DANTA_BASE) {
      const live = await fetchPrice(s.code);
      dantaResults.push(live ? {...s, price:live.price, change:live.change, volRatio:live.volRatio} : {...s, price:0, change:0, volRatio:1});
      await new Promise(r => setTimeout(r, 300));
    }
    allStocks = dantaResults;

    const longResults = [];
    for (const s of LONG) {
      const live = await fetchPrice(s.code);
      longResults.push(live ? {...s, price:live.price, change:live.change} : {...s, price:0, change:0});
      await new Promise(r => setTimeout(r, 300));
    }
    longStocks = longResults;

    const ss = allStocks.find(s=>s.code==='005930');
    const sk = allStocks.find(s=>s.code==='000660');
    if (ss && ss.price) { document.getElementById('h-ss').textContent=ss.price.toLocaleString()+'원'; document.getElementById('h-ss').className='mv '+(ss.change>=0?'up':'down'); }
    if (sk && sk.price) { document.getElementById('h-sk').textContent=sk.price.toLocaleString()+'원'; document.getElementById('h-sk').className='mv '+(sk.change>=0?'up':'down'); }
    document.getElementById('h-time').textContent = new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' 실시간';
    note.innerHTML = '✅ 한투 API 실시간 데이터 연동 완료 — 7월 1일 업데이트';
    note.className = 'note';
  } catch(e) {
    note.innerHTML = '⚠️ 실시간 연동 실패 — 새로고침 해주세요';
    note.className = 'note loading';
  }

  render(allStocks);
}

init();
</script>
